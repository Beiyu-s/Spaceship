<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEIYU YI | Music Composer & Vocalist</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
    <style>
        /* 保持原有CSS样式 */
        :root {
            --primary-color: #0a0a0a;
            --secondary-color: #1a1a1a;
            --accent-color: #3b82f6;
            --text-light: #f5f5f5;
            --text-muted: #a0a0a0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text-light);
            background-color: var(--primary-color);
            overflow-x: hidden;
        }
        /* ... 其他CSS保持不变 ... */
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full bg-black bg-opacity-90 z-50 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-white font-['Playfair_Display']">
                BEIYU <span class="text-blue-500">YI</span>
            </a>
            <div class="hidden md:flex space-x-8">
                <a href="#about" class="nav-link text-white hover:text-blue-400">ABOUT</a>
                <a href="#experience" class="nav-link text-white hover:text-blue-400">EXPERIENCE</a>
                <a href="#skills" class="nav-link text-white hover:text-blue-400">SKILLS</a>
                <a href="#contact" class="nav-link text-white hover:text-blue-400">CONTACT</a>
            </div>
            <button id="mobile-menu-button" class="md:hidden text-white focus:outline-none">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </nav>
    
    <!-- Mobile Menu -->
    <div id="menu-overlay" class="menu-overlay"></div>
    <div id="mobile-menu" class="mobile-menu">
        <div class="flex justify-between items-center mb-8">
            <a href="#" class="text-2xl font-bold text-white font-['Playfair_Display']">
                BEIYU <span class="text-blue-500">YI</span>
            </a>
            <button id="close-menu-button" class="text-white focus:outline-none">
                <i class="fas fa-times text-2xl"></i>
            </button>
        </div>
        <div class="flex flex-col space-y-6">
            <a href="#about" class="nav-link text-white hover:text-blue-400 text-xl">ABOUT</a>
            <a href="#experience" class="nav-link text-white hover:text-blue-400 text-xl">EXPERIENCE</a>
            <a href="#skills" class="nav-link text-white hover:text-blue-400 text-xl">SKILLS</a>
            <a href="#contact" class="nav-link text-white hover:text-blue-400 text-xl">CONTACT</a>
        </div>
    </div>

    <!-- 音频文件 - 使用临时测试链接 -->
    <audio id="background-music" loop preload="metadata">
        <!-- 方案1：临时测试链接（确保可以工作） -->
        <source src="https://raw.githubusercontent.com/Beiyu-s/Spaceship/main/ADropofRed.mp3" type="audio/mpeg">
        
        
        <!-- 方案2：Google Drive链接（推荐） -->
        <!-- <source src="https://docs.google.com/uc?export=download&id=1HprS3BRoLq-wovfhpwqWvBBfu6JA1uYQ" type="audio/mpeg"> -->
        
        您的浏览器不支持音频播放。
    </audio>

    <!-- Hero Section -->
    <section class="hero-bg min-h-screen flex items-center pt-16">
        <div class="container mx-auto px-4 py-16 relative z-10">
            <div class="flex flex-col md:flex-row items-center">
                <div class="md:w-1/2 mb-10 md:mb-0">
                    <h1 class="text-4xl md:text-6xl font-bold mb-4 font-['Playfair_Display']">
                        BEIYU <span class="text-blue-500">YI</span>
                    </h1>
                    <h2 class="text-xl md:text-2xl mb-6 text-gray-300">
                        Music Composer • Vocalist • Voice Artist
                    </h2>
                    <p class="text-lg mb-8 max-w-lg">
                        Jazz & pop vocalist, composer, and music educator based in Los Angeles...
                    </p>
                    <div class="flex space-x-4">
                        <a href="#contact" class="btn-primary">
                            <i class="fas fa-envelope mr-2"></i> Contact Me
                        </a>
                        <!-- 播放音乐按钮 -->
                        <button class="btn-outline" id="play-music-btn">
                            <i class="fas fa-music mr-2"></i> <span id="music-status">Play Music</span>
                        </button>
                    </div>
                    <div class="sound-wave mt-12">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <div class="md:w-1/2 flex justify-center">
                    <img src="https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/code_assistant/95ddb9f3a9f7414a81a3c1f35fc04bc7~tplv-a9rns2rl98-image.image?rcl=202512281017225BECD99165DCB87905F6&amp;rk3s=8e244e95&amp;rrcfp=e75484ac&amp;x-expires=1767493044&amp;x-signature=9QAuhJXkvWBQxEVyWkRCUwSL3qo%3D" alt="Beiyu Yi" class="profile-img w-64 h-64 md:w-80 md:h-80 object-cover rounded-full shadow-2xl">
                </div>
            </div>
        </div>
    </section>

    <!-- 其他部分保持不变 -->

    <script>
        // Initialize GSAP ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);

        // Music Player with Sound Wave Animation
        const music = document.getElementById('background-music');
        const musicButton = document.getElementById('play-music-btn');
        const musicStatus = document.getElementById('music-status');
        const soundWaveSpans = document.querySelectorAll('.sound-wave span');

        // 调试信息
        console.log('音频调试信息:');
        console.log('- 音频元素:', music);
        console.log('- 音频源:', music.querySelector('source').src);
        console.log('- 播放按钮:', musicButton);

        // 音频事件监听
        music.addEventListener('loadeddata', () => {
            console.log('✅ 音频加载完成，可以播放');
            musicStatus.textContent = 'Play Music';
        });

        music.addEventListener('error', (e) => {
            console.error('❌ 音频加载错误:', music.error);
            musicStatus.textContent = '音频加载失败';
            alert('音频文件加载失败，请检查音频链接。');
        });

        // 控制音浪动画
        function startWaveAnimation() {
            soundWaveSpans.forEach(span => {
                span.style.animationPlayState = 'running';
                span.style.opacity = '1';
            });
        }

        function stopWaveAnimation() {
            soundWaveSpans.forEach(span => {
                span.style.animationPlayState = 'paused';
                span.style.opacity = '0.5';
            });
        }

        // 播放/暂停音乐
        function toggleMusic() {
            console.log('播放/暂停点击，当前状态:', music.paused ? '暂停中' : '播放中');
            
            if (music.paused) {
                // 尝试播放
                music.play().then(() => {
                    console.log('✅ 播放成功');
                    musicStatus.textContent = 'Pause Music';
                    startWaveAnimation();
                }).catch(err => {
                    console.warn('播放被阻止:', err.name, err.message);
                    musicStatus.textContent = '点击激活';
                    
                    // 显示用户友好的提示
                    const alertMessage = `
播放被浏览器阻止。这是因为：

1. 浏览器需要用户交互后才能播放音频
2. 这是浏览器的安全策略

解决方案：
1. 点击页面任意位置激活页面
2. 再次点击播放按钮
                    `;
                    
                    if (confirm(alertMessage)) {
                        // 用户确认后，添加一次性点击监听
                        const activateAndPlay = () => {
                            console.log('页面被点击，重新尝试播放');
                            music.play().then(() => {
                                musicStatus.textContent = 'Pause Music';
                                startWaveAnimation();
                                document.removeEventListener('click', activateAndPlay);
                            }).catch(e => console.error('重新播放失败:', e));
                        };
                        document.addEventListener('click', activateAndPlay, { once: true });
                    }
                });
            } else {
                // 暂停
                music.pause();
                musicStatus.textContent = 'Play Music';
                stopWaveAnimation();
                console.log('⏸️ 已暂停');
            }
        }

        // 初始状态
        stopWaveAnimation();

        // 按钮点击事件
        musicButton.addEventListener('click', toggleMusic);

        // 添加页面点击激活（解决自动播放限制）
        document.addEventListener('click', () => {
            console.log('页面被点击，可以解除自动播放限制');
        }, { once: true });

        // 其他JavaScript代码保持不变...
        // Mobile Menu Toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const closeMenuButton = document.getElementById('close-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const mobileMenuLinks = mobileMenu.querySelectorAll('a');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.add('active');
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });

        const closeMenu = () => {
            mobileMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        };

        closeMenuButton.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);
        mobileMenuLinks.forEach(link => link.addEventListener('click', closeMenu));

        // Smooth Scrolling for Navigation Links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if (targetId === '#') return;
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Back to Top Button
        const backToTopButton = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopButton.classList.remove('opacity-0', 'invisible');
                backToTopButton.classList.add('opacity-100', 'visible');
            } else {
                backToTopButton.classList.remove('opacity-100', 'visible');
                backToTopButton.classList.add('opacity-0', 'invisible');
            }
        });

        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Timeline Filtering
        const roleOptions = document.querySelectorAll('.role-option[data-role]');
        const timelineItems = document.querySelectorAll('.timeline-item');

        roleOptions.forEach(option => {
            option.addEventListener('click', () => {
                roleOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                const selectedRole = option.getAttribute('data-role');
                timelineItems.forEach(item => {
                    item.style.display = (selectedRole === 'all' || item.getAttribute('data-category') === selectedRole) ? 'block' : 'none';
                });
            });
        });

        // GSAP Animations
        gsap.from('.hero-bg h1', {
            opacity: 0,
            y: 50,
            duration: 1,
            delay: 0.2
        });
        
        gsap.from('.hero-bg h2', {
            opacity: 0,
            y: 30,
            duration: 1,
            delay: 0.4
        });
        
        gsap.from('.hero-bg p', {
            opacity: 0,
            y: 20,
            duration: 1,
            delay: 0.6
        });
        
        gsap.from('.hero-bg .btn-primary, .hero-bg .btn-outline', {
            opacity: 0,
            y: 20,
            duration: 1,
            delay: 0.8,
            stagger: 0.2
        });
        
        gsap.from('.hero-bg .profile-img', {
            opacity: 0,
            scale: 0.8,
            duration: 1.2,
            delay: 0.5
        });

        // Section Animations
        const sections = document.querySelectorAll('section:not(.hero-bg)');
        
        sections.forEach(section => {
            gsap.from(section.querySelector('.section-title'), {
                scrollTrigger: {
                    trigger: section,
                    start: 'top 80%'
                },
                opacity: 0,
                x: -50,
                duration: 0.8
            });
            
            gsap.from(section.querySelectorAll('.timeline-item, .skill-card'), {
                scrollTrigger: {
                    trigger: section,
                    start: 'top 70%'
                },
                opacity: 0,
                y: 50,
                duration: 0.8,
                stagger: 0.2
            });
        });
    </script>
</body>
</html>
